<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港麻雀 - 計番</title>
    <style>
        :root {
            --bg-color: #0b2e1e;
            --text-main: #ffffff;
            --text-sub: #cbd5e1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: #0d3824;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            padding: 24px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            min-height: 85vh;
        }

        header {
            margin-bottom: 8px;
        }

        .title-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.6rem;
            font-weight: bold;
        }

        .dropdown-icon {
            font-size: 1.1rem;
            color: var(--text-sub);
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .menu-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--text-sub);
            font-size: 0.85rem;
            margin-top: 8px;
            text-decoration: none;
        }

        /* 觀景框取景區 */
        .camera-viewport {
            position: relative;
            width: 100%;
            height: 280px;
            margin: 20px 0;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 即時相機視訊畫面 */
        #cameraStream {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 四角括號覆蓋層（置於相機畫面上方） */
        .corner-frame {
            position: absolute;
            width: 88%;
            height: 140px;
            box-sizing: border-box;
            pointer-events: none;
            z-index: 2;
        }

        .corner-frame::before, .corner-frame::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            border-color: #4ade80;
            border-style: solid;
            border-width: 4px;
        }

        .corner-frame::before {
            top: 0;
            left: 0;
            border-right: none;
            border-bottom: none;
            border-top-left-radius: 6px;
        }

        .corner-frame::after {
            top: 0;
            right: 0;
            border-left: none;
            border-bottom: none;
            border-top-right-radius: 6px;
        }

        .bottom-corners::before, .bottom-corners::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            border-color: #4ade80;
            border-style: solid;
            border-width: 4px;
        }

        .bottom-corners::before {
            bottom: 0;
            left: 0;
            border-right: none;
            border-top: none;
            border-bottom-left-radius: 6px;
        }

        .bottom-corners::after {
            bottom: 0;
            right: 0;
            border-left: none;
            border-top: none;
            border-bottom-right-radius: 6px;
        }

        .score-board {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 8px;
        }

        .action-container {
            display: flex;
            justify-content: flex-end;
            margin-top: auto;
            padding-bottom: 10px;
        }

        .capture-btn {
            background-color: #22c55e;
            color: #064e3b;
            border: none;
            border-radius: 30px;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="title-row">
            香港麻雀 <span class="dropdown-icon">▼</span> 計番
        </div>
        <div class="subtitle">掃描手牌，立即計算番數</div>
        <a class="menu-link">ⓘ 番數表</a>
    </header>

    <!-- 即時相機視訊與取景框 -->
    <div class="camera-viewport">
        <video id="cameraStream" autoplay playsinline></video>
        <div class="corner-frame">
            <div class="bottom-corners"></div>
        </div>
    </div>

    <div class="score-board" id="scoreDisplay">
        目前總番數：0 番
    </div>

    <div class="action-container">
        <button class="capture-btn" onclick="captureImage()">
            📷 影相
        </button>
    </div>
</div>

<canvas id="snapshotCanvas" style="display:none;"></canvas>

<script>
    // 自動向瀏覽器請求開啟後置相機權限並顯示畫面
    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { exact: "environment" } }, // 嘗試調用後置鏡頭
                audio: false
            });
            const videoElement = document.getElementById('cameraStream');
            videoElement.srcObject = stream;
        } catch (err) {
            // 如果後置鏡頭失敗，嘗試切換為任意可用相機（例如前置鏡頭或電腦視訊鏡頭）
            try {
                const fallbackStream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: false
                });
                document.getElementById('cameraStream').srcObject = fallbackStream;
            } catch (e) {
                alert("無法存取相機，請確認是否已允許權限或使用 HTTPS 連線。");
            }
        }
    }

    // 點擊影相按鈕時擷取畫面
    function captureImage() {
        const video = document.getElementById('cameraStream');
        const canvas = document.getElementById('snapshotCanvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        alert("已成功擷取鏡頭畫面，準備進行牌面辨識！");
    }

    // 頁面載入後自動啟動相機
    window.addEventListener('load', initCamera);
</script>

</body>
</html>
