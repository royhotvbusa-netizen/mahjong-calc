<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港麻雀 - 計番</title>
    <!-- 引入 Roboflow 官方 SDK -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/roboflow/0.2.26/roboflow.min.js"></script>
    <style>
        :root {
            --bg-color: #0b2e1e;
            --text-main: #ffffff;
            --text-sub: #cbd5e1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: #0d3824;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            padding: 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            min-height: 80vh;
        }

        header {
            margin-bottom: 4px;
        }

        .title-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.4rem;
            font-weight: bold;
        }

        .dropdown-icon {
            font-size: 1rem;
            color: var(--text-sub);
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .menu-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--text-sub);
            font-size: 0.8rem;
            margin-top: 4px;
            text-decoration: none;
        }

        .camera-viewport {
            position: relative;
            width: 100%;
            height: 180px;
            margin: 12px 0;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #cameraStream {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .corner-frame {
            position: absolute;
            width: 85%;
            height: 110px;
            box-sizing: border-box;
            pointer-events: none;
            z-index: 2;
        }

        .corner-frame::before, .corner-frame::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: #4ade80;
            border-style: solid;
            border-width: 3px;
        }

        .corner-frame::before {
            top: 0;
            left: 0;
            border-right: none;
            border-bottom: none;
            border-top-left-radius: 4px;
        }

        .corner-frame::after {
            top: 0;
            right: 0;
            border-left: none;
            border-bottom: none;
            border-top-right-radius: 4px;
        }

        .bottom-corners::before, .bottom-corners::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: #4ade80;
            border-style: solid;
            border-width: 3px;
        }

        .bottom-corners::before {
            bottom: 0;
            left: 0;
            border-right: none;
            border-top: none;
            border-bottom-left-radius: 4px;
        }

        .bottom-corners::after {
            bottom: 0;
            right: 0;
            border-left: none;
            border-top: none;
            border-bottom-right-radius: 4px;
        }

        .score-board {
            font-size: 1rem;
            font-weight: bold;
            margin-top: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 8px;
            line-height: 1.4;
            word-break: break-all;
        }

        .action-container {
            display: flex;
            justify-content: flex-end;
            margin-top: auto;
            padding-bottom: 5px;
        }

        .capture-btn {
            background-color: #22c55e;
            color: #064e3b;
            border: none;
            border-radius: 25px;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(34, 197, 94, 0.4);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="title-row">
            香港麻雀 <span class="dropdown-icon">▼</span> 計番
        </div>
        <div class="subtitle">掃描手牌，立即計算番數</div>
        <a class="menu-link">ⓘ 番數表</a>
    </header>

    <div class="camera-viewport">
        <video id="cameraStream" autoplay playsinline></video>
        <div class="corner-frame">
            <div class="bottom-corners"></div>
        </div>
    </div>

    <div class="score-board" id="scoreDisplay">
        目前狀態：正在初始化 AI 模型...
    </div>

    <div class="action-container">
        <button class="capture-btn" onclick="captureAndDetect()">
            📷 影相
        </button>
    </div>
</div>

<canvas id="snapshotCanvas" style="display:none;"></canvas>

<script>
    const API_KEY = "rf_jHhGokaKDgVyqG5VhoryNtzXQiO1";
    const MODEL_ID = "mahjong-tile-scoring-3";
    const VERSION = 3;

    let model = null;

    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { exact: "environment" } },
                audio: false
            });
            document.getElementById('cameraStream').srcObject = stream;
        } catch (err) {
            try {
                const fallbackStream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: false
                });
                document.getElementById('cameraStream').srcObject = fallbackStream;
            } catch (e) {
                document.getElementById('scoreDisplay').innerText = "無法存取相機，請檢查權限設定。";
            }
        }
    }

    async function initModel() {
        const scoreDisplay = document.getElementById('scoreDisplay');
        try {
            const rf = await Roboflow({
                apiKey: API_KEY,
                model: MODEL_ID,
                version: VERSION
            });
            model = await rf.load();
            scoreDisplay.innerText = "模型就緒！請將麻雀對準框線，點擊「影相」";
        } catch (err) {
            scoreDisplay.innerText = `⚠️ 模型載入失敗：${err.message || err}`;
        }
    }

    async function captureAndDetect() {
        const scoreDisplay = document.getElementById('scoreDisplay');
        if (!model) {
            scoreDisplay.innerText = "⚠️ 模型仍在載入中，請稍候...";
            return;
        }

        const video = document.getElementById('cameraStream');
        const canvas = document.getElementById('snapshotCanvas');
        
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        scoreDisplay.innerHTML = "🔄 正在分析手牌...";

        try {
            const predictions = await model.detect(canvas);
            
            if (predictions && predictions.length > 0) {
                const detectedTiles = predictions.map(p => p.class);
                scoreDisplay.innerHTML = `🎯 辨識成功！<br>• 偵測到 ${detectedTiles.length} 張牌：${detectedTiles.join(', ')}`;
            } else {
                scoreDisplay.innerHTML = "⚠️ 未能辨識出任何麻雀牌，請調整距離或角度重試。";
            }
        } catch (error) {
            scoreDisplay.innerHTML = `❌ 辨識錯誤：${error.message || error}`;
        }
    }

    window.addEventListener('load', async () => {
        await initCamera();
        await initModel();
    });
</script>

</body>
</html>
