<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>廣東麻雀食糊牌平台 - 拍照自動計番</title>
  <style>
    :root {
      --bg-color: #f7f9fa;
      --card-bg: #ffffff;
      --text-main: #2c3e50;
      --text-sub: #7f8c8d;
      --accent-color: #27ae60;
      --accent-hover: #219653;
      --border-color: #e2e8f0;
      --active-bg: #e8f8f0;
      --disabled-bg: #f1f5f9;
      --disabled-color: #cbd5e1;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    h1 {
      font-size: 1.4rem;
      text-align: center;
      margin-bottom: 16px;
      color: var(--text-main);
    }

    .upload-section {
      border: 2px dashed var(--accent-color);
      padding: 20px;
      text-align: center;
      border-radius: 8px;
      background: var(--active-bg);
      margin-bottom: 16px;
      cursor: pointer;
    }

    .upload-section input {
      display: none;
    }

    .btn {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 16px;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
      font-weight: bold;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn:disabled {
      background-color: var(--disabled-color);
      cursor: not-allowed;
    }

    .status-msg {
      margin-top: 10px;
      font-size: 0.9rem;
      text-align: center;
      color: var(--text-sub);
    }

    .output-box {
      margin-top: 20px;
      padding: 16px;
      background: var(--bg-color);
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    #previewImg {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🀄 廣東麻雀拍照自動計番</h1>

    <div class="upload-section" onclick="document.getElementById('fileInput').click()">
      <p>📷 點擊此處拍攝或上傳麻雀相片</p>
      <input type="file" id="fileInput" accept="image/*" capture="environment" onchange="handleImageUpload(event)">
    </div>

    <img id="previewImg" alt="麻雀牌預覽">

    <button id="analyzeBtn" class="btn" onclick="analyzeImage()" disabled>開始 AI 分析</button>
    <div id="status" class="status-msg">請先上傳相片</div>

    <div class="output-box">
      <p id="cantoneseOutput"><strong>分析結果：</strong>等待相片上傳...</p>
      <p id="englishOutput"><strong>Status:</strong> Awaiting image upload...</p>
    </div>
  </div>

  <script>
    // Roboflow API 設定
    const ROBOFLOW_API_KEY = "zkchDUIdVpHwIWQPZOM";
    const CLOUD_ENDPOINT = "https://serverless.roboflow.com/roy-ho/workflows/mahjong-tile-scoring";

    let selectedBase64Image = "";

    // 1. 處理圖片上傳與自動壓縮 (避免手機拍攝圖片過大導致 400 Bad Request)
    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const status = document.getElementById("status");
      status.innerText = "正在處理相片...";

      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = function () {
          // Canvas 壓縮邏輯 (最大長寬限制 1024px)
          const canvas = document.createElement("canvas");
          let width = img.width;
          let height = img.height;
          const maxDim = 1024;

          if (width > height && width > maxDim) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else if (height > maxDim) {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);

          // 取得壓縮後的 Base64 (JPEG 75% 品質)
          const compressedDataUrl = canvas.toDataURL("image/jpeg", 0.75);
          selectedBase64Image = compressedDataUrl.split(',')[1];

          // 顯示預覽圖
          const preview = document.getElementById("previewImg");
          preview.src = compressedDataUrl;
          preview.style.display = "block";

          document.getElementById("analyzeBtn").disabled = false;
          status.innerText = "相片準備就緒，請點擊「開始 AI 分析」";
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // 2. 呼叫 Roboflow Workflows API 進行辨識
    async function analyzeImage() {
      if (!selectedBase64Image) return;

      const status = document.getElementById("status");
      const btn = document.getElementById("analyzeBtn");
      const cantoneseOutput = document.getElementById("cantoneseOutput");
      const englishOutput = document.getElementById("englishOutput");

      btn.disabled = true;
      status.innerText = "AI 正在辨識麻雀牌中，請稍候...";

      try {
        const response = await fetch(CLOUD_ENDPOINT, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            api_key: ROBOFLOW_API_KEY,
            inputs: {
              "image": {
                "type": "base64",
                "value": selectedBase64Image
              }
            }
          })
        });

        if (!response.ok) {
          throw new Error(`HTTP 錯誤狀態碼: ${response.status}`);
        }

        const result = await response.json();
        console.log("Roboflow Workflow API 回傳結果：", result);

        // 解析回傳成果 (依據 Workflow 輸出結構調整)
        const outputs = result.outputs || result.results || [];
        
        status.innerText = "分析完成！";
        cantoneseOutput.innerHTML = `<strong>辨識結果：</strong> 成功分析牌面！`;
        englishOutput.innerHTML = `<strong>Status:</strong> Analysis complete! Check DevTools console for raw detection details.`;

      } catch (error) {
        console.error("AI 分析失敗詳情：", error);
        status.innerText = "❌ AI 分析失敗，請檢查 Console 控制台紀錄。";
        cantoneseOutput.innerHTML = `<strong>錯誤訊息：</strong> ${error.message}`;
        englishOutput.innerHTML = `<strong>Error:</strong> Failed to call Roboflow API.`;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
