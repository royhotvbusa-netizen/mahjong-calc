<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港麻雀 - 計番</title>
    <style>
        :root {
            --bg-color: #0b2e1e;
            --text-main: #ffffff;
            --text-sub: #cbd5e1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: #0d3824;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            padding: 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            min-height: 80vh;
        }

        header {
            margin-bottom: 4px;
        }

        .title-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.4rem;
            font-weight: bold;
        }

        .dropdown-icon {
            font-size: 1rem;
            color: var(--text-sub);
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .menu-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--text-sub);
            font-size: 0.8rem;
            margin-top: 4px;
            text-decoration: none;
        }

        .camera-viewport {
            position: relative;
            width: 100%;
            height: 180px;
            margin: 12px 0;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #cameraStream {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .corner-frame {
            position: absolute;
            width: 85%;
            height: 110px;
            box-sizing: border-box;
            pointer-events: none;
            z-index: 2;
        }

        .corner-frame::before, .corner-frame::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: #4ade80;
            border-style: solid;
            border-width: 3px;
        }

        .corner-frame::before {
            top: 0;
            left: 0;
            border-right: none;
            border-bottom: none;
            border-top-left-radius: 4px;
        }

        .corner-frame::after {
            top: 0;
            right: 0;
            border-left: none;
            border-bottom: none;
            border-top-right-radius: 4px;
        }

        .bottom-corners::before, .bottom-corners::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: #4ade80;
            border-style: solid;
            border-width: 3px;
        }

        .bottom-corners::before {
            bottom: 0;
            left: 0;
            border-right: none;
            border-top: none;
            border-bottom-left-radius: 4px;
        }

        .bottom-corners::after {
            bottom: 0;
            right: 0;
            border-left: none;
            border-top: none;
            border-bottom-right-radius: 4px;
        }

        .score-board {
            font-size: 1rem;
            font-weight: bold;
            margin-top: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 8px;
            line-height: 1.4;
            word-break: break-all;
        }

        .action-container {
            display: flex;
            justify-content: flex-end;
            margin-top: auto;
            padding-bottom: 5px;
        }

        .capture-btn {
            background-color: #22c55e;
            color: #064e3b;
            border: none;
            border-radius: 25px;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(34, 197, 94, 0.4);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="title-row">
            香港麻雀 <span class="dropdown-icon">▼</span> 計番
        </div>
        <div class="subtitle">掃描手牌，立即計算番數</div>
        <a class="menu-link">ⓘ 番數表</a>
    </header>

    <div class="camera-viewport">
        <video id="cameraStream" autoplay playsinline></video>
        <div class="corner-frame">
            <div class="bottom-corners"></div>
        </div>
    </div>

    <div class="score-board" id="scoreDisplay">
        目前狀態：相機已就緒，請點擊「影相」辨識手牌
    </div>

    <div class="action-container">
        <button class="capture-btn" onclick="captureAndDetect()">
            📷 影相
        </button>
    </div>
</div>

<canvas id="snapshotCanvas" style="display:none;"></canvas>

<script>
    // 已設定您的真實 Publishable API Key
    const API_KEY = "rf_jHhGokaKDgVyqG5VhoryNtzXQiO1";
    const MODEL_ID = "mahjong-tile-scoring-3";
    const VERSION = "3";

    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { exact: "environment" } },
                audio: false
            });
            document.getElementById('cameraStream').srcObject = stream;
        } catch (err) {
            try {
                const fallbackStream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: false
                });
                document.getElementById('cameraStream').srcObject = fallbackStream;
            } catch (e) {
                document.getElementById('scoreDisplay').innerText = "無法存取相機，請檢查權限設定。";
            }
        }
    }

    async function captureAndDetect() {
        const video = document.getElementById('cameraStream');
        const canvas = document.getElementById('snapshotCanvas');
        const scoreDisplay = document.getElementById('scoreDisplay');
        
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        scoreDisplay.innerHTML = "🔄 正在傳送至 AI 模型進行分析...";

        canvas.toBlob(async (blob) => {
            const reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onloadend = async function () {
                const base64Image = reader.result.split(',')[1];

                try {
                    const response = await fetch(`https://detect.roboflow.com/${MODEL_ID}/${VERSION}?api_key=${API_KEY}`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/x-www-form-urlencoded"
                        },
                        body: base64Image
                    });

                    const result = await response.json();
                    
                    if (response.ok && result && result.predictions) {
                        if (result.predictions.length > 0) {
                            const detectedTiles = result.predictions.map(p => p.class);
                            scoreDisplay.innerHTML = `🎯 辨識成功！<br>• 偵測到 ${detectedTiles.length} 張牌：${detectedTiles.join(', ')}`;
                        } else {
                            scoreDisplay.innerHTML = "⚠️ 未能辨識出任何麻雀牌，請調整距離或角度重試。";
                        }
                    } else {
                        scoreDisplay.innerHTML = `❌ API 錯誤 (${response.status})：${result.message || JSON.stringify(result)}`;
                    }
                } catch (error) {
                    scoreDisplay.innerHTML = `❌ 連線失敗詳細原因：${error.message}`;
                }
            };
        }, "image/jpeg", 0.8);
    }

    window.addEventListener('load', initCamera);
</script>

</body>
</html>
