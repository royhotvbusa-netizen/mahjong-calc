<script>
  // Roboflow API 設定 (使用 Hosted Model API，避開 Workflow CORS 限制)
  const ROBOFLOW_API_KEY = "zkchDUIdVpHwIWQPZOM";
  // 直接指向 v3 模型端點
  const MODEL_ENDPOINT = "https://detect.roboflow.com/mahjong-tile-scoring/3";

  let selectedBase64Image = "";

  // 1. 處理圖片上傳與壓縮 (避免手機大圖超時)
  function handleImageUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    const status = document.getElementById("status");
    status.innerText = "正在處理相片...";

    const reader = new FileReader();
    reader.onload = function (e) {
      const img = new Image();
      img.onload = function () {
        const canvas = document.createElement("canvas");
        let width = img.width;
        let height = img.height;
        const maxDim = 1024;

        if (width > height && width > maxDim) {
          height = Math.round((height * maxDim) / width);
          width = maxDim;
        } else if (height > maxDim) {
          width = Math.round((width * maxDim) / height);
          height = maxDim;
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);

        const compressedDataUrl = canvas.toDataURL("image/jpeg", 0.75);
        selectedBase64Image = compressedDataUrl.split(',')[1];

        const preview = document.getElementById("previewImg");
        preview.src = compressedDataUrl;
        preview.style.display = "block";

        document.getElementById("analyzeBtn").disabled = false;
        status.innerText = "相片準備就緒，請點擊「開始 AI 分析」";
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // 2. 呼叫 Roboflow Hosted Model API
  async function analyzeImage() {
    if (!selectedBase64Image) return;

    const status = document.getElementById("status");
    const btn = document.getElementById("analyzeBtn");
    const cantoneseOutput = document.getElementById("cantoneseOutput");
    const englishOutput = document.getElementById("englishOutput");

    btn.disabled = true;
    status.innerText = "AI 正在辨識麻雀牌中，請稍候...";

    try {
      // 使用 Roboflow 標準 Object Detection API
      const url = `${MODEL_ENDPOINT}?api_key=${ROBOFLOW_API_KEY}&confidence=30`;

      const response = await fetch(url, {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded"
        },
        body: selectedBase64Image
      });

      if (!response.ok) {
        throw new Error(`HTTP 錯誤狀態碼: ${response.status}`);
      }

      const result = await response.json();
      console.log("Roboflow 辨識結果：", result);

      const predictions = result.predictions || [];
      
      status.innerText = `分析完成！共辨識出 ${predictions.length} 張牌`;
      
      // 整理辨識出的牌名
      if (predictions.length > 0) {
        const detectedTiles = predictions.map(p => p.class).join(', ');
        cantoneseOutput.innerHTML = `<strong>辨識結果：</strong> ${detectedTiles}`;
        englishOutput.innerHTML = `<strong>Detected Tiles:</strong> ${detectedTiles}`;
      } else {
        cantoneseOutput.innerHTML = `<strong>辨識結果：</strong> 未能清晰辨識麻雀牌，請嘗試近距離拍攝。`;
        englishOutput.innerHTML = `<strong>Result:</strong> No tiles detected clearly.`;
      }

    } catch (error) {
      console.error("AI 分析失敗詳情：", error);
      status.innerText = "❌ AI 分析失敗，請檢查 Console 控制台紀錄。";
      cantoneseOutput.innerHTML = `<strong>錯誤訊息：</strong> ${error.message}`;
      englishOutput.innerHTML = `<strong>Error:</strong> Failed to call Roboflow API.`;
    } finally {
      btn.disabled = false;
    }
  }
</script>
