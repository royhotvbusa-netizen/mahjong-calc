<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>香港麻雀 - 計番</title>
    <style>
        :root {
            --bg-color: #0b2e1e;
            --text-main: #ffffff;
            --text-sub: #cbd5e1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: #0d3824;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            padding: 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            min-height: 80vh;
        }

        header { margin-bottom: 4px; }

        .title-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.4rem;
            font-weight: bold;
        }

        .dropdown-icon { font-size: 1rem; color: var(--text-sub); }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .menu-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--text-sub);
            font-size: 0.8rem;
            margin-top: 4px;
            text-decoration: none;
            cursor: pointer;
        }

        .mode-tabs {
            display: flex;
            gap: 6px;
            margin: 10px 0;
            background: rgba(255,255,255,0.06);
            padding: 4px;
            border-radius: 8px;
        }

        .mode-tab {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 6px;
            font-size: 0.85rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .mode-tab.active {
            background-color: #22c55e;
            color: #064e3b;
        }

        .camera-viewport {
            position: relative;
            width: 100%;
            height: 180px;
            margin: 8px 0;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        #cameraStream {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .corner-frame {
            position: absolute;
            width: 80%;
            height: 70px;
            box-sizing: border-box;
            pointer-events: none;
            z-index: 2;
        }

        .corner-frame::before, .corner-frame::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            border-color: #4ade80;
            border-style: solid;
            border-width: 3px;
        }

        .corner-frame::before { top: 0; left: 0; border-right: none; border-bottom: none; border-top-left-radius: 4px; }
        .corner-frame::after { top: 0; right: 0; border-left: none; border-bottom: none; border-top-right-radius: 4px; }

        .bottom-corners {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .bottom-corners::before, .bottom-corners::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            border-color: #4ade80;
            border-style: solid;
            border-width: 3px;
        }

        .bottom-corners::before { bottom: 0; left: 0; border-right: none; border-top: none; border-bottom-left-radius: 4px; }
        .bottom-corners::after { bottom: 0; right: 0; border-left: none; border-top: none; border-bottom-right-radius: 4px; }

        .fullscreen-camera {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .fullscreen-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .camera-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .mask-top, .mask-bottom {
            width: 100%;
            background: rgba(0, 0, 0, 0.75);
            flex: 1;
        }

        .scan-strip-container {
            width: 100%;
            height: 80px;
            display: flex;
            position: relative;
            align-items: center;
        }

        .mask-left, .mask-right {
            background: rgba(0, 0, 0, 0.75);
            height: 100%;
            width: 5%;
        }

        .scan-box {
            flex: 1;
            height: 100%;
            border: 2px solid rgba(74, 222, 128, 0.9);
            border-radius: 8px;
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 15px rgba(74, 222, 128, 0.3);
        }

        .scan-box::before, .scan-box::after,
        .scan-box-corners::before, .scan-box-corners::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            border-color: #4ade80;
            border-style: solid;
            border-width: 3px;
        }

        .scan-box::before { top: -2px; left: -2px; border-right: none; border-bottom: none; border-top-left-radius: 6px; }
        .scan-box::after { top: -2px; right: -2px; border-left: none; border-bottom: none; border-top-right-radius: 6px; }

        .scan-box-corners {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .scan-box-corners::before { bottom: -2px; left: -2px; border-right: none; border-top: none; border-bottom-left-radius: 6px; }
        .scan-box-corners::after { bottom: -2px; right: -2px; border-left: none; border-top: none; border-bottom-right-radius: 6px; }

        .guide-tooltip {
            position: absolute;
            bottom: 18%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            z-index: 10001;
        }

        .guide-arrows {
            color: #ffffff;
            font-size: 1.2rem;
            margin-bottom: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .guide-text-pill {
            background: rgba(0, 0, 0, 0.75);
            color: #ffffff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .shutter-btn {
            position: absolute;
            right: 28px;
            top: 50%;
            transform: translateY(-50%);
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            border: 3px solid #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            pointer-events: auto;
            z-index: 10002;
        }

        .shutter-inner {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #ffffff;
        }

        .close-cam-btn {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            color: #ffffff;
            font-size: 1.4rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            pointer-events: auto;
            z-index: 10002;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .manual-panel {
            background: rgba(255,255,255,0.06);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .sub-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
        }

        .sub-tab-btn {
            flex: 1;
            padding: 4px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: var(--text-main);
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .sub-tab-btn.active {
            background: #3b82f6;
            border-color: #3b82f6;
            font-weight: bold;
        }

        .picker-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-bottom: 8px;
        }

        .picker-tile {
            background: #ffffff;
            color: #1e293b;
            border: 1px solid #cbd5e1;
            padding: 6px 2px;
            text-align: center;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
        }
        .picker-tile:hover { background: #f1f5f9; }

        .selected-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
            margin-bottom: 4px;
        }

        .clear-btn {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            cursor: pointer;
            font-weight: bold;
        }
        .clear-btn:hover { background: rgba(239, 68, 68, 0.4); }

        .selected-box {
            background: rgba(0,0,0,0.2);
            border-radius: 6px;
            padding: 6px 8px;
            min-height: 36px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
            font-size: 0.8rem;
        }

        .selected-badge {
            background: #e0f2fe;
            color: #0369a1;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
        }
        .selected-badge span { cursor: pointer; color: #ef4444; font-weight: bold; }

        .settings-panel {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
            max-height: 220px;
            overflow-y: auto;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .settings-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.08);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .settings-item input {
            width: 40px;
            text-align: center;
            padding: 2px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            background: rgba(255,255,255,0.9);
            font-size: 0.8rem;
        }

        .context-panel {
            background: rgba(255,255,255,0.06);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 10px;
            font-size: 0.85rem;
        }

        .context-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .context-row:last-child { margin-bottom: 0; }

        .context-label { color: var(--text-sub); }

        .seg-group { display: flex; gap: 4px; }

        .seg-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: var(--text-main);
            border-radius: 6px;
            padding: 3px 9px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .seg-btn.active {
            background-color: #22c55e;
            color: #064e3b;
            font-weight: bold;
            border-color: #22c55e;
        }

        .hand-input {
            width: 40px;
            padding: 2px 4px;
            font-size: 0.85rem;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.9);
            text-align: center;
        }

        .score-board {
            font-size: 1rem;
            font-weight: bold;
            margin-top: 4px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 8px;
            line-height: 1.5;
            word-break: break-word;
        }

        .fan-total {
            font-size: 1.3rem;
            color: #4ade80;
            margin-bottom: 6px;
        }

        .fan-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 0.88rem;
            font-weight: normal;
        }

        .fan-list li {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
        }

        .fan-list li:last-child { border-bottom: none; }

        .tile-echo {
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-top: 8px;
            word-break: break-all;
        }

        .warn-text { color: #fbbf24; }
        .error-text { color: #f87171; }

        .action-container {
            display: flex;
            justify-content: flex-end;
            margin-top: auto;
            padding-bottom: 5px;
        }

        .capture-btn {
            background-color: #22c55e;
            color: #064e3b;
            border: none;
            border-radius: 25px;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(34, 197, 94, 0.4);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="title-row">
            香港麻雀 <span class="dropdown-icon">▼</span> 計番
        </div>
        <div class="subtitle">掃描手牌或手動選牌，立即計算番數</div>
        <a class="menu-link" onclick="toggleSettingsPanel()">⚙️ 番數規則設定</a>
    </header>

    <div class="mode-tabs">
        <button class="mode-tab active" id="modeCameraBtn" onclick="switchMode('camera')">📷 相機辨識</button>
        <button class="mode-tab" id="modeManualBtn" onclick="switchMode('manual')">✋ 手動選牌</button>
    </div>

    <div class="settings-panel" id="settingsPanel" style="display: none;">
        <div style="font-weight: bold; margin-bottom: 6px; font-size: 0.85rem; color: #4ade80;">番數設定 (修改後自動儲存)</div>
        <div class="settings-grid" id="settingsContainer"></div>
    </div>

    <div class="camera-viewport" id="cameraContainer" onclick="openFullscreenCamera()">
        <video id="cameraStream" autoplay playsinline muted></video>
        <div class="corner-frame">
            <div class="bottom-corners"></div>
        </div>
    </div>

    <div class="manual-panel" id="manualContainer" style="display: none;">
        <div class="sub-tabs">
            <button class="sub-tab-btn active" onclick="switchPickerTab('honor', this)">字牌</button>
            <button class="sub-tab-btn" onclick="switchPickerTab('character', this)">萬子</button>
            <button class="sub-tab-btn" onclick="switchPickerTab('bamboo', this)">索子</button>
            <button class="sub-tab-btn" onclick="switchPickerTab('dot', this)">筒子</button>
        </div>
        <div id="pickerHonor" class="picker-grid"></div>
        <div id="pickerCharacter" class="picker-grid" style="display:none;"></div>
        <div id="pickerBamboo" class="picker-grid" style="display:none;"></div>
        <div id="pickerDot" class="picker-grid" style="display:none;"></div>

        <div class="selected-header">
            <span style="font-size: 0.75rem; color: var(--text-sub);">已選牌組 (點擊紅 × 可刪除)：</span>
            <button class="clear-btn" onclick="clearAllManualTiles()">🗑️ 清除全部</button>
        </div>
        <div id="selectedTilesContainer" class="selected-box">
            <span style="color: #94a3b8; font-size: 0.75rem;">尚未選擇任何牌張</span>
        </div>
    </div>

    <div class="context-panel">
        <div class="context-row">
            <span class="context-label">門風（座位）</span>
            <div class="seg-group" id="seatWindGroup">
                <button class="seg-btn active" data-wind="E">東</button>
                <button class="seg-btn" data-wind="S">南</button>
                <button class="seg-btn" data-wind="W">西</button>
                <button class="seg-btn" data-wind="N">北</button>
            </div>
        </div>
        <div class="context-row">
            <span class="context-label">第 <input type="number" id="handNumber" class="hand-input" value="1" min="1" max="16"> 盤（自動推算圈風）</span>
            <span id="prevailingWindDisplay" style="font-weight:bold;">圈風：東</span>
        </div>
        <div class="context-row">
            <span class="context-label">自摸 / 出銃</span>
            <div class="seg-group">
                <button class="seg-btn active" id="ronBtn">出銃/食糊</button>
                <button class="seg-btn" id="zimoBtn">自摸</button>
            </div>
        </div>
    </div>

    <div class="score-board" id="scoreDisplay">
        請點擊「影相」開啟全螢幕掃描，或切換至手動選牌
    </div>

    <div class="action-container" id="actionContainer">
        <button class="capture-btn" id="captureBtn" onclick="openFullscreenCamera()">
            📷 影相
        </button>
    </div>
</div>

<div class="fullscreen-camera" id="fullscreenCameraModal" style="display: none;">
    <video class="fullscreen-video" id="fullscreenVideo" autoplay playsinline muted></video>
    <div class="close-cam-btn" onclick="closeFullscreenCamera()">&times;</div>
    
    <div class="camera-overlay">
        <div class="mask-top"></div>
        <div class="scan-strip-container">
            <div class="mask-left"></div>
            <div class="scan-box" id="scanBox">
                <div class="scan-box-corners"></div>
            </div>
            <div class="mask-right"></div>
        </div>
        <div class="mask-bottom"></div>
    </div>

    <div class="guide-tooltip">
        <div class="guide-arrows">↑ ↑</div>
        <div class="guide-text-pill">靠近將麻雀牌填滿綠框</div>
    </div>

    <div class="shutter-btn" onclick="captureFromFullscreen()">
        <div class="shutter-inner"></div>
    </div>
</div>

<canvas id="snapshotCanvas" style="display:none;"></canvas>

<script>
    const API_KEY = "zkiChDUIdVpHwIWQPZOM";
    const MODEL_ID = "mahjong-tile-scoring";
    const VERSION = 3;

    let mediaStream = null;

    window.addEventListener('load', async () => {
        initSettingsUI();
        initPickers();
        await initCameraStream();
    });

    const defaultFanConfig = {
        shisanyao: { cn: '十三么', en: 'Thirteen Orphans', fan: 10 },
        ziyise: { cn: '字一色', en: 'All Honors', fan: 10 },
        dasixi: { cn: '大四喜', en: 'Big Four Winds', fan: 10 },
        dasanyuan: { cn: '大三元', en: 'Big Three Dragons', fan: 8 },
        xiaosixi: { cn: '小四喜', en: 'Little Four Winds', fan: 5 },
        qingyise: { cn: '清一色', en: 'Full Flush', fan: 7 },
        xiaosanyuan: { cn: '小三元', en: 'Little Three Dragons', fan: 4 },
        hunyise: { cn: '混一色', en: 'Half Flush', fan: 3 },
        duiduihu: { cn: '對對糊', en: 'All Triplets', fan: 3 },
        pingwu: { cn: '平糊', en: 'Common Hand', fan: 1 },
        quanfengke: { cn: '圈風刻', en: 'Prevailing Wind Triplet', fan: 1 },
        menfengke: { cn: '門風刻', en: 'Seat Wind Triplet', fan: 1 },
        dragonke: { cn: '龍牌刻', en: 'Dragon Triplet', fan: 1 },
        zimo: { cn: '自摸', en: 'Self-Draw', fan: 1 }
    };

    let FAN_NAMES = JSON.parse(localStorage.getItem('hk_mahjong_fans')) || defaultFanConfig;

    function initSettingsUI() {
        const container = document.getElementById('settingsContainer');
        container.innerHTML = '';
        for (let key in FAN_NAMES) {
            const item = document.createElement('div');
            item.className = 'settings-item';
            item.innerHTML = `<span>${FAN_NAMES[key].cn}</span><input type="number" id="fan_input_${key}" value="${FAN_NAMES[key].fan}" onchange="updateFanValue('${key}', this.value)">`;
            container.appendChild(item);
        }
    }

    function updateFanValue(key, val) {
        FAN_NAMES[key].fan = parseInt(val) || 0;
        localStorage.setItem('hk_mahjong_fans', JSON.stringify(FAN_NAMES));
    }

    function toggleSettingsPanel() {
        const panel = document.getElementById('settingsPanel');
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    }

    let currentMode = 'camera';
    function switchMode(mode) {
        currentMode = mode;
        document.getElementById('modeCameraBtn').classList.toggle('active', mode === 'camera');
        document.getElementById('modeManualBtn').classList.toggle('active', mode === 'manual');
        document.getElementById('cameraContainer').style.display = mode === 'camera' ? 'flex' : 'none';
        document.getElementById('manualContainer').style.display = mode === 'manual' ? 'block' : 'none';
        
        const actionContainer = document.getElementById('actionContainer');
        if (mode === 'camera') {
            actionContainer.style.display = 'flex';
            document.getElementById('scoreDisplay').innerHTML = "請點擊「影相」開啟全螢幕掃描，或切換至手動選牌";
        } else {
            actionContainer.style.display = 'none';
            evaluateManualHand();
        }
    }

    const manualTilesData = {
        honor: [
            { label: '東', val: 'E' }, { label: '南', val: 'S' }, { label: '西', val: 'W' }, { label: '北', val: 'N' },
            { label: '中', val: 'RD' }, { label: '發', val: 'GD' }, { label: '白', val: 'WD' }
        ],
        character: [
            { label: '一萬', val: '1m' }, { label: '二萬', val: '2m' }, { label: '三萬', val: '3m' },
            { label: '四萬', val: '4m' }, { label: '五萬', val: '5m' }, { label: '六萬', val: '6m' },
            { label: '七萬', val: '7m' }, { label: '八萬', val: '8m' }, { label: '九萬', val: '9m' }
        ],
        bamboo: [
            { label: '一索', val: '1s' }, { label: '二索', val: '2s' }, { label: '三索', val: '3s' },
            { label: '四索', val: '4s' }, { label: '五索', val: '5s' }, { label: '六索', val: '6s' },
            { label: '七索', val: '7s' }, { label: '八索', val: '8s' }, { label: '九索', val: '9s' }
        ],
        dot: [
            { label: '一筒', val: '1p' }, { label: '二筒', val: '2p' }, { label: '三筒', val: '3p' },
            { label: '四筒', val: '4p' }, { label: '五筒', val: '5p' }, { label: '六筒', val: '6p' },
            { label: '七筒', val: '7p' }, { label: '八筒', val: '8p' }, { label: '九筒', val: '9p' }
        ]
    };

    let selectedManualTiles = [];

    function initPickers() {
        for (let cat in manualTilesData) {
            const container = document.getElementById('picker' + cat.charAt(0).toUpperCase() + cat.slice(1));
            manualTilesData[cat].forEach(t => {
                const btn = document.createElement('div');
                btn.className = 'picker-tile';
                btn.innerText = t.label;
                btn.onclick = () => addManualTile(t.val, t.label);
                container.appendChild(btn);
            });
        }
    }

    function switchPickerTab(category, btnElem) {
        document.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.remove('active'));
        btnElem.classList.add('active');
        ['honor', 'character', 'bamboo', 'dot'].forEach(cat => {
            document.getElementById('picker' + cat.charAt(0).toUpperCase() + cat.slice(1)).style.display = (cat === category) ? 'grid' : 'none';
        });
    }

    const tileDisplayNames = {
        'E': '東', 'S': '南', 'W': '西', 'N': '北',
        'RD': '中', 'GD': '發', 'WD': '白',
        '1m': '一萬', '2m': '二萬', '3m': '三萬', '4m': '四萬', '5m': '五萬', '6m': '六萬', '7m': '七萬', '8m': '八萬', '9m': '九萬',
        '1s': '一索', '2s': '二索', '3s': '三索', '4s': '四索', '5s': '五索', '6s': '六索', '7s': '七索', '8s': '八索', '9s': '九索',
        '1p': '一筒', '2p': '二筒', '3p': '三筒', '4p': '四筒', '5p': '五筒', '6p': '六筒', '7p': '七筒', '8p': '八筒', '9p': '九筒'
    };

    function addManualTile(val, label) {
        if (selectedManualTiles.length >= 18) {
            alert('手牌最多只能選擇 18 張（包含開槓）！');
            return;
        }
        selectedManualTiles.push(val);
        renderSelectedManualTiles();
        evaluateManualHand();
    }

    function removeManualTile(index) {
        selectedManualTiles.splice(index, 1);
        renderSelectedManualTiles();
        evaluateManualHand();
    }

    function clearAllManualTiles() {
        selectedManualTiles = [];
        renderSelectedManualTiles();
        evaluateManualHand();
    }

    function renderSelectedManualTiles() {
        const container = document.getElementById('selectedTilesContainer');
        if (selectedManualTiles.length === 0) {
            container.innerHTML = '<span style="color: #94a3b8; font-size: 0.75rem;">尚未選擇任何牌張</span>';
            return;
        }
        container.innerHTML = '';
        selectedManualTiles.forEach((t, idx) => {
            const badge = document.createElement('div');
            badge.className = 'selected-badge';
            badge.innerHTML = `${tileDisplayNames[t] || t} <span onclick="removeManualTile(${idx})">&times;</span>`;
            container.appendChild(badge);
        });
    }

    function evaluateManualHand() {
        if (currentMode !== 'manual') return;
        if (selectedManualTiles.length < 14) {
            document.getElementById('scoreDisplay').innerHTML = `⚠️ <span class="warn-text">已選 ${selectedManualTiles.length} 張牌</span><br>食糊至少需要 14 張牌（如有開槓可為 15–18 張）。`;
            return;
        }
        const ctx = { prevailingWind, seatWind, isSelfDraw };
        const result = calculateBestScore(selectedManualTiles, ctx);
        if (!result) {
            document.getElementById('scoreDisplay').innerHTML = `❌ <span class="error-text">呢組牌無法組成有效糊牌。</span><br>已選：${selectedManualTiles.map(t => tileDisplayNames[t]).join(' ')}`;
            return;
        }
        renderResultHTML(result, selectedManualTiles.map(t => tileDisplayNames[t]));
    }

    const WINDS = ['E', 'S', 'W', 'N'];
    const WIND_NAME = { E: '東', S: '南', W: '西', N: '北' };

    let seatWind = 'E';
    let isSelfDraw = false;
    let currentHand = 1;
    let prevailingWind = 'E';

    function updateContext() {
        currentHand = Math.max(1, parseInt(document.getElementById('handNumber').value) || 1);
        document.getElementById('handNumber').value = currentHand;
        const windIndex = Math.floor((currentHand - 1) / 4) % 4;
        prevailingWind = WINDS[windIndex];
        document.getElementById('prevailingWindDisplay').innerText = `圈風：${WIND_NAME[prevailingWind]}`;
        
        if (currentMode === 'manual') evaluateManualHand();
    }
    document.getElementById('handNumber').addEventListener('change', updateContext);

    document.querySelectorAll('#seatWindGroup .seg-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('#seatWindGroup .seg-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            seatWind = btn.dataset.wind;
            if (currentMode === 'manual') evaluateManualHand();
        });
    });

    document.getElementById('ronBtn').addEventListener('click', () => {
        isSelfDraw = false;
        document.getElementById('ronBtn').classList.add('active');
        document.getElementById('zimoBtn').classList.remove('active');
        if (currentMode === 'manual') evaluateManualHand();
    });
    document.getElementById('zimoBtn').addEventListener('click', () => {
        isSelfDraw = true;
        document.getElementById('zimoBtn').classList.add('active');
        document.getElementById('ronBtn').classList.remove('active');
        if (currentMode === 'manual') evaluateManualHand();
    });

    updateContext();

    async function initCameraStream() {
        try {
            mediaStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { exact: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: false
            });
            document.getElementById('cameraStream').srcObject = mediaStream;
            document.getElementById('fullscreenVideo').srcObject = mediaStream;
        } catch (err) {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                document.getElementById('cameraStream').srcObject = mediaStream;
                document.getElementById('fullscreenVideo').srcObject = mediaStream;
            } catch (e) {
                document.getElementById('scoreDisplay').innerText = "無法存取相機，請檢查權限設定。";
            }
        }
    }

    function openFullscreenCamera() {
        document.getElementById('fullscreenCameraModal').style.display = 'flex';
    }

    function closeFullscreenCamera() {
        document.getElementById('fullscreenCameraModal').style.display = 'none';
    }

    const HONOR_ALIASES = {
        east: 'E', dong: 'E',
        south: 'S', nan: 'S',
        west: 'W', xi: 'W',
        north: 'N', bei: 'N',
        red: 'RD', zhong: 'RD', reddragon: 'RD',
        green: 'GD', fa: 'GD', greendragon: 'GD',
        white: 'WD', bai: 'WD', whitedragon: 'WD', baiban: 'WD', blank: 'WD'
    };

    const SUIT_ALIASES = {
        wan: 'm', man: 'm', character: 'm', characters: 'm', char: 'm', m: 'm',
        tiao: 's', suo: 's', sou: 's', bamboo: 's', bam: 's', s: 's',
        tong: 'p', pin: 'p', dot: 'p', dots: 'p', circle: 'p', p: 'p'
    };

    function normalizeTileClass(raw) {
        if (!raw) return null;
        const s = String(raw).toLowerCase().replace(/[\s_\-]/g, '');
        if (HONOR_ALIASES[s]) return HONOR_ALIASES[s];

        let m = s.match(/^(\d)([a-z]+)$/);
        if (m && SUIT_ALIASES[m[2]]) return `${m[1]}${SUIT_ALIASES[m[2]]}`;

        m = s.match(/^([a-z]+)(\d)$/);
        if (m && SUIT_ALIASES[m[1]]) return `${m[2]}${SUIT_ALIASES[m[1]]}`;

        return null;
    }

    const HONOR_TILES = ['E', 'S', 'W', 'N', 'RD', 'GD', 'WD'];
    const WIND_TILES = ['E', 'S', 'W', 'N'];
    const DRAGON_TILES = ['RD', 'GD', 'WD'];
    const TERMINAL_HONOR_SET = ['1m', '9m', '1s', '9s', '1p', '9p', 'E', 'S', 'W', 'N', 'RD', 'GD', 'WD'];

    const isHonor = t => HONOR_TILES.includes(t);
    const isSuited = t => /^[1-9][msp]$/.test(t);
    const tileSuit = t => isSuited(t) ? t[1] : null;
    const tileNum = t => isSuited(t) ? parseInt(t[0], 10) : null;

    function tileSortKey(t) {
        if (isSuited(t)) {
            const order = { m: 0, s: 1, p: 2 };
            return order[tileSuit(t)] * 10 + tileNum(t);
        }
        const order = { E: 100, S: 101, W: 102, N: 103, RD: 104, GD: 105, WD: 106 };
        return order[t] ?? 200;
    }
    const sortTiles = tiles => [...tiles].sort((a, b) => tileSortKey(a) - tileSortKey(b));

    function removeOne(arr, tile) {
        const idx = arr.indexOf(tile);
        if (idx === -1) return null;
        const copy = [...arr];
        copy.splice(idx, 1);
        return copy;
    }
    function removeTiles(arr, list) {
        let cur = arr;
        for (const t of list) {
            cur = removeOne(cur, t);
            if (cur === null) return null;
        }
        return cur;
    }

    function decomposeMelds(tiles) {
        if (tiles.length === 0) return [[]];
        const results = [];
        const first = tiles[0];
        const cnt = tiles.filter(t => t === first).length;

        if (cnt >= 4) {
            const rest = removeTiles(tiles, [first, first, first, first]);
            if (rest !== null) {
                for (const sub of decomposeMelds(sortTiles(rest))) {
                    results.push([{ type: 'triplet', tile: first }, ...sub]);
                }
            }
        }

        if (cnt >= 3) {
            const rest = removeTiles(tiles, [first, first, first]);
            if (rest !== null) {
                for (const sub of decomposeMelds(sortTiles(rest))) {
                    results.push([{ type: 'triplet', tile: first }, ...sub]);
                }
            }
        }

        if (isSuited(first)) {
            const n = tileNum(first), suit = tileSuit(first);
            if (n <= 7) {
                const t2 = `${n + 1}${suit}`, t3 = `${n + 2}${suit}`;
                if (tiles.includes(t2) && tiles.includes(t3)) {
                    const rest = removeTiles(tiles, [first, t2, t3]);
                    if (rest !== null) {
                        for (const sub of decomposeMelds(sortTiles(rest))) {
                            results.push([{ type: 'sequence', tile: first }, ...sub]);
                        }
                    }
                }
            }
        }
        return results;
    }

    function findHandDecompositions(tiles) {
        const distinct = [...new Set(tiles)];
        const decomps = [];
        for (const pairTile of distinct) {
            const count = tiles.filter(t => t === pairTile).length;
            if (count < 2) continue;
            const remaining = removeTiles(tiles, [pairTile, pairTile]);
            if (remaining === null) continue;
            const meldOptions = decomposeMelds(sortTiles(remaining));
            for (const sets of meldOptions) {
                if (sets.length === 4) decomps.push({ pair: pairTile, sets });
            }
        }
        return decomps;
    }

    function isThirteenOrphans(tiles) {
        if (tiles.length !== 14) return false;
        if (tiles.some(t => !TERMINAL_HONOR_SET.includes(t))) return false;
        const counts = {};
        tiles.forEach(t => counts[t] = (counts[t] || 0) + 1);
        return Object.keys(counts).length === 13 && Object.values(counts).filter(c => c === 2).length === 1;
    }

    function analyzeDecomposition(decomp, ctx) {
        const { pair, sets } = decomp;
        const suitsUsed = new Set();
        let allTriplet = true;
        const dragonTriplets = [];
        const windTriplets = [];

        sets.forEach(s => {
            if (s.type === 'sequence') {
                allTriplet = false;
                suitsUsed.add(tileSuit(s.tile));
            } else {
                if (isSuited(s.tile)) suitsUsed.add(tileSuit(s.tile));
                else if (DRAGON_TILES.includes(s.tile)) dragonTriplets.push(s.tile);
                else if (WIND_TILES.includes(s.tile)) windTriplets.push(s.tile);
            }
        });
        if (isSuited(pair)) suitsUsed.add(tileSuit(pair));

        const hasHonorAnywhere = sets.some(s => isHonor(s.tile)) || isHonor(pair);
        const suitCount = suitsUsed.size;
        const isDragonPair = DRAGON_TILES.includes(pair);
        const isWindPair = WIND_TILES.includes(pair);

        const flags = {
            ziyise: suitCount === 0 && hasHonorAnywhere,
            qingyise: suitCount === 1 && !hasHonorAnywhere,
            hunyise: suitCount === 1 && hasHonorAnywhere,
            duiduihu: allTriplet,
            dasanyuan: dragonTriplets.length === 3,
            xiaosanyuan: dragonTriplets.length === 2 && isDragonPair,
            dasixi: windTriplets.length === 4,
            xiaosixi: windTriplets.length === 3 && isWindPair,
            pingwu: !allTriplet && sets.every(s => s.type === 'sequence')
        };

        const breakdown = [];

        if (flags.ziyise) breakdown.push('ziyise');
        else {
            if (flags.dasixi) breakdown.push('dasixi');
            else if (flags.xiaosixi) breakdown.push('xiaosixi');

            if (flags.dasanyuan) breakdown.push('dasanyuan');
            else if (flags.xiaosanyuan) breakdown.push('xiaosanyuan');

            if (flags.qingyise) breakdown.push('qingyise');
            else if (flags.hunyise) breakdown.push('hunyise');

            if (flags.duiduihu) breakdown.push('duiduihu');
            if (flags.pingwu) breakdown.push('pingwu');
        }

        const hasSpecialWindDragon = flags.ziyise || flags.dasixi || flags.xiaosixi || flags.dasanyuan || flags.xiaosanyuan;

        if (!hasSpecialWindDragon) {
            if (windTriplets.includes(ctx.prevailingWind)) breakdown.push('quanfengke');
            if (windTriplets.includes(ctx.seatWind)) breakdown.push('menfengke');
            dragonTriplets.forEach(() => breakdown.push('dragonke'));
        }

        if (ctx.isSelfDraw) breakdown.push('zimo');

        const total = breakdown.reduce((sum, id) => sum + (FAN_NAMES[id] ? FAN_NAMES[id].fan : 0), 0);
        return { total, breakdown };
    }

    function calculateBestScore(tiles, ctx) {
        if (isThirteenOrphans(tiles)) {
            const breakdown = ['shisanyao'];
            if (ctx.isSelfDraw) breakdown.push('zimo');
            return { total: breakdown.reduce((s, id) => s + (FAN_NAMES[id] ? FAN_NAMES[id].fan : 0), 0), breakdown };
        }

        const decomps = findHandDecompositions(tiles);
        if (decomps.length === 0) return null;

        let best = null;
        for (const d of decomps) {
            const result = analyzeDecomposition(d, ctx);
            if (!best || result.total > best.total) best = result;
        }
        return best;
    }

    function renderResultHTML(result, displayTiles) {
        const scoreDisplay = document.getElementById('scoreDisplay');
        const html = `
            <div class="fan-total">總番數：${result.total} 番</div>
            <ul class="fan-list">
                ${result.breakdown.map(id => `<li><span>${FAN_NAMES[id] ? FAN_NAMES[id].cn : id} (${FAN_NAMES[id] ? FAN_NAMES[id].en : ''})</span><span>${FAN_NAMES[id] ? FAN_NAMES[id].fan : 0} 番</span></li>`).join('')}
            </ul>
            <div class="tile-echo">牌張：${displayTiles.join(' ')}</div>
        `;
        scoreDisplay.innerHTML = html;
    }

    function renderScore(tiles, unmapped) {
        const scoreDisplay = document.getElementById('scoreDisplay');

        if (unmapped.length > 0) {
            scoreDisplay.innerHTML = `⚠️ <span class="warn-text">有 ${unmapped.length} 張牌無法辨識：${unmapped.join(', ')}</span><br>請調整拍攝角度重試。`;
            return;
        }

        if (tiles.length < 14 || tiles.length > 18) {
            scoreDisplay.innerHTML = `⚠️ <span class="warn-text">偵測到 ${tiles.length} 張牌，食糊需要 14–18 張。</span><br>目前偵測：${tiles.map(t => tileDisplayNames[t] || t).join(', ') || '（無）'}`;
            return;
        }

        const ctx = { prevailingWind, seatWind, isSelfDraw };
        const result = calculateBestScore(tiles, ctx);

        if (!result) {
            scoreDisplay.innerHTML = `❌ <span class="error-text">呢組牌無法組成有效糊牌。</span><br>偵測到：${tiles.map(t => tileDisplayNames[t] || t).join(', ')}`;
            return;
        }

        renderResultHTML(result, tiles.map(t => tileDisplayNames[t] || t));
    }

    function sendToRoboflow(blob, onComplete, onError) {
        const formData = new FormData();
        formData.append("file", blob, "image.jpg");

        const xhr = new XMLHttpRequest();
        const apiUrl = `https://detect.roboflow.com/${MODEL_ID}/${VERSION}?api_key=${API_KEY}&confidence=10&overlap=40`;

        xhr.open("POST", apiUrl, true);

        xhr.onload = function () {
            if (xhr.status >= 200 && xhr.status < 300) {
                try {
                    const data = JSON.parse(xhr.responseText);
                    onComplete(data.predictions || []);
                } catch (e) {
                    onError(`解析回應失敗：${e.message}`);
                }
            } else {
                onError(`伺服器回應錯誤 (HTTP ${xhr.status}): ${xhr.responseText || xhr.statusText}`);
            }
        };

        xhr.onerror = function () {
            onError(`跨域或網路連線被封鎖 (CORS Error)。`);
        };

        xhr.send(formData);
    }

    function processImageAndSend(video, scanBox) {
        const scoreDisplay = document.getElementById('scoreDisplay');
        const canvas = document.getElementById('snapshotCanvas');

        if (!video || !video.videoWidth) {
            scoreDisplay.innerHTML = "⚠️ 相機尚未準備好，請稍候再試。";
            return;
        }

        scoreDisplay.innerHTML = "🔄 正在分析手牌...";

        const videoWidth = video.videoWidth;
        const videoHeight = video.videoHeight;

        // 計算對應 scanBox 的動態區域
        let cropX = 0, cropY = 0, cropW = videoWidth, cropH = videoHeight;
        if (scanBox) {
            const videoRect = video.getBoundingClientRect();
            const scanRect = scanBox.getBoundingClientRect();
            if (videoRect.width > 0 && videoRect.height > 0) {
                const scaleX = videoWidth / videoRect.width;
                const scaleY = videoHeight / videoRect.height;
                cropX = Math.max(0, (scanRect.left - videoRect.left) * scaleX);
                cropY = Math.max(0, (scanRect.top - videoRect.top) * scaleY);
                cropW = Math.min(videoWidth - cropX, scanRect.width * scaleX);
                cropH = Math.min(videoHeight - cropY, scanRect.height * scaleY);
            }
        }

        // 先嘗試發送精準裁切區域
        canvas.width = Math.max(1, cropW);
        canvas.height = Math.max(1, cropH);

        const ctx2d = canvas.getContext('2d');
        ctx2d.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, canvas.width, canvas.height);

        canvas.toBlob((blob) => {
            if (!blob) {
                scoreDisplay.innerHTML = "❌ 圖片處理失敗，請重試。";
                return;
            }

            sendToRoboflow(blob, (predictions) => {
                if (predictions.length > 0) {
                    handlePredictions(predictions);
                } else {
                    // 若裁切區域無法辨識，備援嘗試發送全螢幕影像
                    scoreDisplay.innerHTML = "🔄 切換為全區域分析中...";
                    canvas.width = videoWidth;
                    canvas.height = videoHeight;
                    ctx2d.drawImage(video, 0, 0, videoWidth, videoHeight);
                    canvas.toBlob((fullBlob) => {
                        sendToRoboflow(fullBlob, (fullPredictions) => {
                            if (fullPredictions.length === 0) {
                                scoreDisplay.innerHTML = "⚠️ 未能辨識出任何麻雀牌，請近距離並平行拍攝。";
                                return;
                            }
                            handlePredictions(fullPredictions);
                        }, (err) => scoreDisplay.innerHTML = `❌ ${err}`);
                    }, 'image/jpeg', 0.90);
                }
            }, (err) => scoreDisplay.innerHTML = `❌ ${err}`);
        }, 'image/jpeg', 0.90);
    }

    function handlePredictions(predictions) {
        predictions.sort((a, b) => a.x - b.x);
        const rawClasses = predictions.map(p => p.class);
        const tiles = [];
        const unmapped = [];
        rawClasses.forEach(raw => {
            const norm = normalizeTileClass(raw);
            if (norm) tiles.push(norm);
            else unmapped.push(raw);
        });
        renderScore(tiles, unmapped);
    }

    function captureFromFullscreen() {
        const video = document.getElementById('fullscreenVideo');
        const scanBox = document.getElementById('scanBox');
        closeFullscreenCamera();
        processImageAndSend(video, scanBox);
    }
</script>
