<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港麻雀 - 計番</title>
    <style>
        :root {
            --bg-color: #0b2e1e;
            --text-main: #ffffff;
            --text-sub: #cbd5e1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 8px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: #0d3824;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            padding: 14px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            min-height: 90vh;
        }

        header { margin-bottom: 2px; }

        .title-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .dropdown-icon { font-size: 0.9rem; color: var(--text-sub); }

        .subtitle {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .menu-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--text-sub);
            font-size: 0.75rem;
            margin-top: 2px;
            text-decoration: none;
        }

        /* 橫向相機檢視區 */
        .camera-viewport {
            position: relative;
            width: 100%;
            height: 240px;
            margin: 10px 0;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #cameraStream {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 橫向長形對焦框 */
        .corner-frame {
            position: absolute;
            width: 92%;
            height: 130px;
            box-sizing: border-box;
            pointer-events: none;
            z-index: 2;
        }

        .corner-frame::before, .corner-frame::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: #4ade80;
            border-style: solid;
            border-width: 3px;
        }

        .corner-frame::before { top: 0; left: 0; border-right: none; border-bottom: none; border-top-left-radius: 4px; }
        .corner-frame::after { top: 0; right: 0; border-left: none; border-bottom: none; border-top-right-radius: 4px; }

        .bottom-corners::before, .bottom-corners::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: #4ade80;
            border-style: solid;
            border-width: 3px;
        }

        .bottom-corners::before { bottom: 0; left: 0; border-right: none; border-top: none; border-bottom-left-radius: 4px; }
        .bottom-corners::after { bottom: 0; right: 0; border-left: none; border-top: none; border-bottom-right-radius: 4px; }

        .context-panel {
            background: rgba(255,255,255,0.06);
            border-radius: 10px;
            padding: 8px 12px;
            margin-bottom: 10px;
            font-size: 0.82rem;
        }

        .context-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .context-row:last-child { margin-bottom: 0; }

        .context-label { color: var(--text-sub); }

        .seg-group { display: flex; gap: 4px; }

        .seg-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: var(--text-main);
            border-radius: 6px;
            padding: 3px 8px;
            font-size: 0.78rem;
            cursor: pointer;
        }

        .seg-btn.active {
            background-color: #22c55e;
            color: #064e3b;
            font-weight: bold;
            border-color: #22c55e;
        }

        .hand-input {
            width: 42px;
            padding: 2px 4px;
            font-size: 0.8rem;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.9);
            text-align: center;
        }

        .score-board {
            font-size: 0.95rem;
            font-weight: bold;
            margin-top: 4px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 10px;
            border-radius: 8px;
            line-height: 1.4;
            word-break: break-word;
        }

        .fan-total {
            font-size: 1.2rem;
            color: #4ade80;
            margin-bottom: 4px;
        }

        .fan-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 0.85rem;
            font-weight: normal;
        }

        .fan-list li {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
        }

        .fan-list li:last-child { border-bottom: none; }

        .tile-echo {
            font-size: 0.72rem;
            color: var(--text-sub);
            margin-top: 6px;
            word-break: break-all;
        }

        .warn-text { color: #fbbf24; }
        .error-text { color: #f87171; }

        .action-container {
            display: flex;
            justify-content: flex-end;
            margin-top: auto;
            padding-top: 6px;
        }

        .capture-btn {
            background-color: #22c55e;
            color: #064e3b;
            border: none;
            border-radius: 25px;
            padding: 8px 22px;
            font-size: 0.95rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(34, 197, 94, 0.4);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="title-row">
            香港麻雀 <span class="dropdown-icon">▼</span> 計番
        </div>
        <div class="subtitle">橫向掃描 14 張手牌，立即計算番數</div>
        <a class="menu-link">ⓘ 番數表</a>
    </header>

    <div class="camera-viewport">
        <video id="cameraStream" autoplay playsinline></video>
        <div class="corner-frame">
            <div class="bottom-corners"></div>
        </div>
    </div>

    <div class="context-panel">
        <div class="context-row">
            <span class="context-label">門風（座位）</span>
            <div class="seg-group" id="seatWindGroup">
                <button class="seg-btn active" data-wind="E">東</button>
                <button class="seg-btn" data-wind="S">南</button>
                <button class="seg-btn" data-wind="W">西</button>
                <button class="seg-btn" data-wind="N">北</button>
            </div>
        </div>
        <div class="context-row">
            <span class="context-label">第 <input type="number" id="handNumber" class="hand-input" value="1" min="1" max="16"> 盤（自動推算圈風）</span>
            <span id="prevailingWindDisplay" style="font-weight:bold;">圈風：東</span>
        </div>
        <div class="context-row">
            <span class="context-label">自摸（相片無法判斷，請手動選擇）</span>
            <div class="seg-group">
                <button class="seg-btn active" id="ronBtn">出銃/食糊</button>
                <button class="seg-btn" id="zimoBtn">自摸</button>
            </div>
        </div>
    </div>

    <div class="score-board" id="scoreDisplay">
        相機已就緒，請將 14 張牌打橫對準框線，點擊「影相」
    </div>

    <div class="action-container">
        <button class="capture-btn" id="captureBtn" onclick="captureAndDetect()">
            📷 影相
        </button>
    </div>
</div>

<canvas id="snapshotCanvas" style="display:none;"></canvas>

<script>
    const API_KEY = "rf_jHhGokaKDgVyqG5VhoryNtzXQiO1";
    const MODEL_ID = "mahjong-tile-scoring-3";
    const VERSION = 3;

    // ============================================================
    // Game Context
    // ============================================================
    const WINDS = ['E', 'S', 'W', 'N'];
    const WIND_NAME = { E: '東', S: '南', W: '西', N: '北' };

    let seatWind = 'E';
    let isSelfDraw = false;
    let currentHand = 1;
    let prevailingWind = 'E';

    function updateContext() {
        currentHand = Math.max(1, parseInt(document.getElementById('handNumber').value) || 1);
        document.getElementById('handNumber').value = currentHand;
        const windIndex = Math.floor((currentHand - 1) / 4) % 4;
        prevailingWind = WINDS[windIndex];
        document.getElementById('prevailingWindDisplay').innerText = `圈風：${WIND_NAME[prevailingWind]}`;
    }
    document.getElementById('handNumber').addEventListener('change', updateContext);

    document.querySelectorAll('#seatWindGroup .seg-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('#seatWindGroup .seg-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            seatWind = btn.dataset.wind;
        });
    });

    document.getElementById('ronBtn').addEventListener('click', () => {
        isSelfDraw = false;
        document.getElementById('ronBtn').classList.add('active');
        document.getElementById('zimoBtn').classList.remove('active');
    });
    document.getElementById('zimoBtn').addEventListener('click', () => {
        isSelfDraw = true;
        document.getElementById('zimoBtn').classList.add('active');
        document.getElementById('ronBtn').classList.remove('active');
    });

    updateContext();

    // ============================================================
    // Camera
    // ============================================================
    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { exact: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: false
            });
            document.getElementById('cameraStream').srcObject = stream;
        } catch (err) {
            try {
                const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                document.getElementById('cameraStream').srcObject = fallbackStream;
            } catch (e) {
                document.getElementById('scoreDisplay').innerText = "無法存取相機，請檢查權限設定。";
            }
        }
    }

    // ============================================================
    // Normalization & Scoring Logic
    // ============================================================
    const HONOR_ALIASES = {
        east: 'E', dong: 'E', south: 'S', nan: 'S', west: 'W', xi: 'W', north: 'N', bei: 'N',
        red: 'RD', zhong: 'RD', reddragon: 'RD', green: 'GD', fa: 'GD', greendragon: 'GD',
        white: 'WD', bai: 'WD', whitedragon: 'WD', baiban: 'WD', blank: 'WD'
    };
    const SUIT_ALIASES = {
        wan: 'm', man: 'm', character: 'm', m: 'm',
        tiao: 's', suo: 's', sou: 's', bamboo: 's', s: 's',
        tong: 'p', pin: 'p', dot: 'p', p: 'p'
    };

    function normalizeTileClass(raw) {
        if (!raw) return null;
        const s = String(raw).toLowerCase().replace(/[\s_\-]/g, '');
        if (HONOR_ALIASES[s]) return HONOR_ALIASES[s];
        let m = s.match(/^(\d)([a-z]+)$/);
        if (m && SUIT_ALIASES[m[2]]) return `${m[1]}${SUIT_ALIASES[m[2]]}`;
        m = s.match(/^([a-z]+)(\d)$/);
        if (m && SUIT_ALIASES[m[1]]) return `${m[2]}${SUIT_ALIASES[m[1]]}`;
        return null;
    }

    const HONOR_TILES = ['E', 'S', 'W', 'N', 'RD', 'GD', 'WD'];
    const DRAGON_TILES = ['RD', 'GD', 'WD'];
    const WIND_TILES = ['E', 'S', 'W', 'N'];
    const TERMINAL_HONOR_SET = ['1m', '9m', '1s', '9s', '1p', '9p', 'E', 'S', 'W', 'N', 'RD', 'GD', 'WD'];

    const isHonor = t => HONOR_TILES.includes(t);
    const isSuited = t => /^[1-9][msp]$/.test(t);
    const tileSuit = t => isSuited(t) ? t[1] : null;
    const tileNum = t => isSuited(t) ? parseInt(t[0], 10) : null;

    function tileSortKey(t) {
        if (isSuited(t)) {
            const order = { m: 0, s: 1, p: 2 };
            return order[tileSuit(t)] * 10 + tileNum(t);
        }
        const order = { E: 100, S: 101, W: 102, N: 103, RD: 104, GD: 105, WD: 106 };
        return order[t] ?? 200;
    }
    const sortTiles = tiles => [...tiles].sort((a, b) => tileSortKey(a) - tileSortKey(b));

    function removeOne(arr, tile) {
        const idx = arr.indexOf(tile);
        if (idx === -1) return null;
        const copy = [...arr];
        copy.splice(idx, 1);
        return copy;
    }
    function removeTiles(arr, list) {
        let cur = arr;
        for (const t of list) {
            cur = removeOne(cur, t);
            if (cur === null) return null;
        }
        return cur;
    }

    function decomposeMelds(tiles) {
        if (tiles.length === 0) return [[]];
        const results = [];
        const first = tiles[0];
        const cnt = tiles.filter(t => t === first).length;

        if (cnt >= 3) {
            const rest = removeTiles(tiles, [first, first, first]);
            if (rest !== null) {
                for (const sub of decomposeMelds(sortTiles(rest))) {
                    results.push([{ type: 'triplet', tile: first }, ...sub]);
                }
            }
        }

        if (isSuited(first)) {
            const n = tileNum(first), suit = tileSuit(first);
            if (n <= 7) {
                const t2 = `${n + 1}${suit}`, t3 = `${n + 2}${suit}`;
                if (tiles.includes(t2) && tiles.includes(t3)) {
                    const rest = removeTiles(tiles, [first, t2, t3]);
                    if (rest !== null) {
                        for (const sub of decomposeMelds(sortTiles(rest))) {
                            results.push([{ type: 'sequence', tile: first }, ...sub]);
                        }
                    }
                }
            }
        }
        return results;
    }

    function findHandDecompositions(tiles14) {
        const distinct = [...new Set(tiles14)];
        const decomps = [];
        for (const pairTile of distinct) {
            if (tiles14.filter(t => t === pairTile).length < 2) continue;
            const remaining = removeTiles(tiles14, [pairTile, pairTile]);
            if (remaining === null) continue;
            for (const sets of decomposeMelds(sortTiles(remaining))) {
                if (sets.length === 4) decomps.push({ pair: pairTile, sets });
            }
        }
        return decomps;
    }

    function isThirteenOrphans(tiles14) {
        if (tiles14.some(t => !TERMINAL_HONOR_SET.includes(t))) return false;
        const counts = {};
        tiles14.forEach(t => counts[t] = (counts[t] || 0) + 1);
        if (Object.keys(counts).length !== 13) return false;
        return Object.values(counts).filter(c => c === 2).length === 1;
    }

    const ABSORBS_WIND_DRAGON = ['shisanyao', 'ziyise', 'dasixi', 'dasanyuan', 'xiaosixi', 'xiaosanyuan', 'qingyise'];
    const FAN_NAMES = {
        shisanyao: { cn: '十三么', fan: 10 },
        ziyise: { cn: '字一色', fan: 10 },
        dasixi: { cn: '大四喜', fan: 10 },
        dasanyuan: { cn: '大三元', fan: 8 },
        xiaosixi: { cn: '小四喜', fan: 5 },
        qingyise: { cn: '清一色', fan: 7 },
        xiaosanyuan: { cn: '小三元', fan: 4 },
        hunyise: { cn: '混一色', fan: 3 },
        duiduihu: { cn: '對對糊', fan: 3 },
        pingwu: { cn: '平糊', fan: 1 },
        quanfengke: { cn: '圈風刻', fan: 1 },
        menfengke: { cn: '門風刻', fan: 1 },
        dragonke: { cn: '龍牌刻', fan: 1 },
        zimo: { cn: '自摸', fan: 1 }
    };

    function analyzeDecomposition(decomp, ctx) {
        const { pair, sets } = decomp;
        const suitsUsed = new Set();
        let allTriplet = true;
        const dragonTriplets = [];
        const windTriplets = [];

        sets.forEach(s => {
            if (s.type === 'sequence') allTriplet = false;
            else {
                if (DRAGON_TILES.includes(s.tile)) dragonTriplets.push(s.tile);
                else if (WIND_TILES.includes(s.tile)) windTriplets.push(s.tile);
            }
            if (isSuited(s.tile)) suitsUsed.add(tileSuit(s.tile));
        });
        if (isSuited(pair)) suitsUsed.add(tileSuit(pair));

        const hasHonor = sets.some(s => isHonor(s.tile)) || isHonor(pair);
        const suitCount = suitsUsed.size;

        const flags = {
            ziyise: suitCount === 0 && hasHonor,
            qingyise: suitCount === 1 && !hasHonor,
            hunyise: suitCount === 1 && hasHonor,
            duiduihu: allTriplet,
            dasanyuan: dragonTriplets.length === 3,
            xiaosanyuan: dragonTriplets.length === 2 && DRAGON_TILES.includes(pair),
            dasixi: windTriplets.length === 4,
            xiaosixi: windTriplets.length === 3 && WIND_TILES.includes(pair),
            pingwu: !allTriplet && sets.every(s => s.type === 'sequence')
        };

        const shapeOrder = ['dasixi', 'dasanyuan', 'xiaosixi', 'qingyise', 'xiaosanyuan', 'hunyise', 'duiduihu', 'pingwu'];
        let shape = shapeOrder.find(s => flags[s]) || null;
        if (flags.ziyise) shape = 'ziyise';

        const breakdown = [];
        if (shape) breakdown.push(shape);

        if (!ABSORBS_WIND_DRAGON.includes(shape)) {
            if (windTriplets.includes(ctx.prevailingWind)) breakdown.push('quanfengke');
            if (windTriplets.includes(ctx.seatWind)) breakdown.push('menfengke');
            dragonTriplets.forEach(() => breakdown.push('dragonke'));
        }
        if (ctx.isSelfDraw) breakdown.push('zimo');

        return { total: breakdown.reduce((sum, id) => sum + FAN_NAMES[id].fan, 0), breakdown };
    }

    function calculateBestScore(tiles14, ctx) {
        if (isThirteenOrphans(tiles14)) {
            const breakdown = ['shisanyao'];
            if (ctx.isSelfDraw) breakdown.push('zimo');
            return { total: breakdown.reduce((s, id) => s + FAN_NAMES[id].fan, 0), breakdown };
        }
        const decomps = findHandDecompositions(tiles14);
        if (decomps.length === 0) return null;
        let best = null;
        for (const d of decomps) {
            const res = analyzeDecomposition(d, ctx);
            if (!best || res.total > best.total) best = res;
        }
        return best;
    }

    function renderScore(tiles14, unmapped) {
        const scoreDisplay = document.getElementById('scoreDisplay');
        if (unmapped.length > 0) {
            scoreDisplay.innerHTML = `⚠️ <span class="warn-text">有 ${unmapped.length} 張牌無法辨識：${unmapped.join(', ')}</span>`;
            return;
        }
        if (tiles14.length !== 14) {
            scoreDisplay.innerHTML = `⚠️ <span class="warn-text">偵測到 ${tiles14.length} 張牌，計番需要 14 張。</span><br>目前：${tiles14.join(', ') || '（無）'}`;
            return;
        }
        const result = calculateBestScore(tiles14, { prevailingWind, seatWind, isSelfDraw });
        if (!result) {
            scoreDisplay.innerHTML = `❌ <span class="error-text">組不成有效糊牌。</span><br>${tiles14.join(', ')}`;
            return;
        }
        scoreDisplay.innerHTML = `
            <div class="fan-total">總番數：${result.total} 番</div>
            <ul class="fan-list">
                ${result.breakdown.map(id => `<li><span>${FAN_NAMES[id].cn}</span><span>${FAN_NAMES[id].fan} 番</span></li>`).join('')}
            </ul>
            <div class="tile-echo">偵測：${tiles14.join(' ')}</div>
        `;
    }

    // ============================================================
    // Capture & Detect via Standard HTTP API
    // ============================================================
    async function captureAndDetect() {
        const scoreDisplay = document.getElementById('scoreDisplay');
        const video = document.getElementById('cameraStream');
        const canvas = document.getElementById('snapshotCanvas');

        canvas.width = 640;
        canvas.height = 480;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        
        scoreDisplay.innerHTML = "🔄 正在上傳分析...";

        canvas.toBlob(async (blob) => {
            try {
                const uploadUrl = `https://detect.roboflow.com/${MODEL_ID}/${VERSION}?api_key=${API_KEY}`;
                const response = await fetch(uploadUrl, { method: 'POST', body: blob });
                
                if (!response.ok) throw new Error(`伺服器回應錯誤 (${response.status})`);
                
                const data = await response.json();
                const predictions = data.predictions || [];

                const tiles14 = [];
                const unmapped = [];
                predictions.forEach(p => {
                    const norm = normalizeTileClass(p.class);
                    if (norm) tiles14.push(norm);
                    else unmapped.push(p.class);
                });

                renderScore(tiles14, unmapped);
            } catch (err) {
                scoreDisplay.innerHTML = `❌ <span class="error-text">請求失敗：${err.message}</span>`;
            }
        }, 'image/jpeg', 0.85);
    }

    window.addEventListener('load', initCamera);
</script>

</body>
</html>
