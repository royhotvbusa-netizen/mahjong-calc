<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>廣東麻雀食糊牌平台 - 拍照自動計番</title>
  <!-- Roboflow Official Web SDK -->
  <script src="https://cdn.roboflow.com/0.2.26/roboflow.js"></script>
  <style>
    :root {
      --bg-color: #f7f9fa;
      --card-bg: #ffffff;
      --text-main: #2c3e50;
      --text-sub: #7f8c8d;
      --accent-color: #27ae60;
      --accent-hover: #219653;
      --border-color: #e2e8f0;
      --active-bg: #e8f8f0;
      --disabled-bg: #f1f5f9;
      --disabled-color: #cbd5e1;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    h1 {
      font-size: 1.4rem;
      text-align: center;
      margin-bottom: 16px;
      color: var(--text-main);
    }

    .upload-section {
      border: 2px dashed var(--accent-color);
      padding: 20px;
      text-align: center;
      border-radius: 8px;
      background: var(--active-bg);
      margin-bottom: 16px;
      cursor: pointer;
    }

    .upload-section input {
      display: none;
    }

    .btn {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 16px;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
      font-weight: bold;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn:disabled {
      background-color: var(--disabled-color);
      cursor: not-allowed;
    }

    .status-msg {
      margin-top: 10px;
      font-size: 0.9rem;
      text-align: center;
      color: var(--text-sub);
    }

    .output-box {
      margin-top: 20px;
      padding: 16px;
      background: var(--bg-color);
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    #previewImg {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🀄 廣東麻雀拍照自動計番</h1>

    <div class="upload-section" onclick="document.getElementById('fileInput').click()">
      <p>📷 點擊此處拍攝或上傳麻雀相片</p>
      <input type="file" id="fileInput" accept="image/*" capture="environment" onchange="handleImageUpload(event)">
    </div>

    <img id="previewImg" alt="麻雀牌預覽">

    <button id="analyzeBtn" class="btn" onclick="analyzeImage()" disabled>開始 AI 分析</button>
    <div id="status" class="status-msg">正在加載 AI 模型，請稍候...</div>

    <div class="output-box">
      <p id="cantoneseOutput"><strong>分析結果：</strong>等待相片上傳...</p>
      <p id="englishOutput"><strong>Status:</strong> Awaiting image upload...</p>
    </div>
  </div>

  <script>
    const ROBOFLOW_PUBLISHABLE_KEY = "rf_jHhGOkaKDgVyqG5VhOryNtzXqIo1";
    const MODEL_ID = "mahjong-tile-scoring";
    const MODEL_VERSION = 3;

    let roboflowModel = null;

    // Load model upon window launch
    window.onload = function() {
      const status = document.getElementById("status");
      if (window.roboflow) {
        roboflow.auth({
          publishable_key: ROBOFLOW_PUBLISHABLE_KEY
        }).load({
          model: MODEL_ID,
          version: MODEL_VERSION
        }).then(function(model) {
          roboflowModel = model;
          console.log("Roboflow Model Loaded Successfully!");
          status.innerText = "請先上傳相片";
        }).catch(function(err) {
          console.error("Roboflow Load Error:", err);
          status.innerText = "⚠️ AI 模型初始化失敗，請查看控制台。";
        });
      }
    };

    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const status = document.getElementById("status");
      status.innerText = "正在處理相片...";

      const reader = new FileReader();
      reader.onload = function (e) {
        const preview = document.getElementById("previewImg");
        preview.src = e.target.result;
        preview.style.display = "block";

        document.getElementById("analyzeBtn").disabled = false;
        status.innerText = "相片準備就緒，請點擊「開始 AI 分析」";
      };
      reader.readAsDataURL(file);
    }

    async function analyzeImage() {
      const imgElement = document.getElementById("previewImg");
      const status = document.getElementById("status");
      const btn = document.getElementById("analyzeBtn");
      const cantoneseOutput = document.getElementById("cantoneseOutput");
      const englishOutput = document.getElementById("englishOutput");

      if (!imgElement.src) return;

      btn.disabled = true;
      status.innerText = "AI 正在辨識麻雀牌中，請稍候...";

      try {
        let predictions = [];

        if (roboflowModel) {
          predictions = await roboflowModel.detect(imgElement);
        } else {
          // Direct API fallback using the publishable key
          const url = `https://detect.roboflow.com/${MODEL_ID}/${MODEL_VERSION}?api_key=${ROBOFLOW_PUBLISHABLE_KEY}&confidence=30`;
          const base64Data = imgElement.src.split(',')[1];
          
          const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: base64Data
          });

          if (!response.ok) throw new Error(`HTTP Error Code: ${response.status}`);
          const resJson = await response.json();
          predictions = resJson.predictions || [];
        }

        console.log("Detections:", predictions);
        status.innerText = `分析完成！共辨識出 ${predictions.length} 張牌`;

        if (predictions.length > 0) {
          const detectedTiles = predictions.map(p => p.class).join(', ');
          cantoneseOutput.innerHTML = `<strong>辨識結果：</strong> ${detectedTiles}`;
          englishOutput.innerHTML = `<strong>Detected Tiles:</strong> ${detectedTiles}`;
        } else {
          cantoneseOutput.innerHTML = `<strong>辨識結果：</strong> 未能清晰辨識麻雀牌，請嘗試近距離拍攝。`;
          englishOutput.innerHTML = `<strong>Result:</strong> No tiles detected clearly.`;
        }

      } catch (error) {
        console.error("Inference Error:", error);
        status.innerText = "❌ AI 分析失敗，請檢查 Console 控制台紀錄。";
        cantoneseOutput.innerHTML = `<strong>錯誤訊息：</strong> ${error.message}`;
        englishOutput.innerHTML = `<strong>Error:</strong> Failed to execute inference.`;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
